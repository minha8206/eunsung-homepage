<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼룸 · EUNSEONG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{background:#0b0f15}
@keyframes eyePulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.scene{position:relative;width:100%;height:100vh;min-height:720px;overflow:hidden;cursor:crosshair}
.eye{position:absolute;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.45);z-index:6;transition:transform .3s;padding:0;display:none}
.eye:hover{transform:scale(1.16)}
.eye::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid rgba(255,255,255,.7);animation:eyePulse 2.6s ease-out infinite}
.eye svg{width:19px;height:19px;display:block}
.zbtn{display:flex;align-items:center;gap:11px;padding:10px 16px 10px 14px;border-left:2px solid rgba(255,255,255,.25);background:transparent;cursor:pointer;color:#eef3f8;text-align:left;transition:.35s;opacity:.5}
.zbtn:hover{opacity:1;background:rgba(255,255,255,.06)}
.specrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.specrow span:first-child{font:600 10px 'Manrope';letter-spacing:.18em;color:rgba(255,255,255,.45)}
.specrow span:last-child{font:500 13px 'Manrope';color:#eef3f8;text-align:right}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;font:600 12px 'Manrope';letter-spacing:.14em;cursor:pointer;border:none;transition:.3s}
.sc-topnav{background:rgba(250,248,243,.85)}
</style>
<script src="vendor/three.min.js"></script>
</head>
<body>

<!-- NAV -->
<div class="sc-topnav">
  <a href="index.html" class="sc-brand">
    <svg width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#b8935f" stroke-width="1.6"/><circle cx="16" cy="16" r="4.5" fill="#b8935f"/></svg>
    <span style="line-height:1"><span class="sc-brand-name">EUNSEONG</span><span class="sc-brand-sub">CERAMIC · STONE · SURFACE</span></span>
  </a>
  <nav class="sc-nav">
    <a href="about.html">회사소개</a>
    <a href="index.html#materials">소재</a>
    <a href="showroom.html" class="is-active">쇼룸</a>
    <a href="portfolio.html">시공사례</a>
    <a href="process.html">제작과정</a>
    <a href="index.html#inquiry">문의</a>
  </nav>
  <div class="sc-nav-actions">
    <button type="button" class="sc-icon-btn" aria-label="검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <div class="sc-lang">
      <span class="sc-lang-en">EN</span><span class="sc-lang-sep">|</span><span class="sc-lang-ko is-active">KO</span>
    </div>
    <button type="button" class="sc-icon-btn" aria-label="마이페이지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.7-4 4.2-6 7.5-6s5.8 2 7.5 6"/></svg>
    </button>
  </div>
</div>

<!-- ===================== SHOWROOM · 3D BY MATERIAL ===================== -->
<div id="showroom" class="scene" style="background:#0b0f15;cursor:grab">
  <canvas id="sr-canvas" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
  <div style="position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(11,15,21,.5),rgba(11,15,21,0) 20%,rgba(11,15,21,0) 66%,rgba(11,15,21,.7)),linear-gradient(90deg,rgba(11,15,21,.42),rgba(11,15,21,0) 28%)"></div>

  <div id="sr-load" style="position:absolute;inset:0;display:grid;place-items:center;background:#0b0f15;z-index:40;color:#aeb8c4;font:500 11px 'Manrope';letter-spacing:.4em">LOADING SHOWROOM…</div>

  <!-- material category selector -->
  <div style="position:absolute;left:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:15;background:rgba(8,11,16,.46);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px 12px">
    <div style="font:600 9px 'Manrope';letter-spacing:.32em;color:rgba(255,255,255,.45);margin:0 0 8px 14px">MATERIALS · 소재</div>
    <button class="zbtn" data-mat="CERAMIC"><span style="font:600 11px 'Manrope';letter-spacing:.08em;width:66px">CERAMIC</span><span style="font:500 11px 'Manrope';opacity:.8">세라믹 슬랩</span></button>
    <button class="zbtn" data-mat="ESTONE"><span style="font:600 11px 'Manrope';letter-spacing:.08em;width:66px">E-STONE</span><span style="font:500 11px 'Manrope';opacity:.8">엔지니어드 스톤</span></button>
    <button class="zbtn" data-mat="MMA"><span style="font:600 11px 'Manrope';letter-spacing:.08em;width:66px">MMA</span><span style="font:500 11px 'Manrope';opacity:.8">아크릴 솔리드</span></button>
    <button class="zbtn" data-mat="BMC"><span style="font:600 11px 'Manrope';letter-spacing:.08em;width:66px">BMC</span><span style="font:500 11px 'Manrope';opacity:.8">몰딩 컴파운드</span></button>
  </div>

  <!-- headline -->
  <div style="position:absolute;left:30px;bottom:30px;z-index:12;pointer-events:none;color:#eef3f8">
    <div id="zone-tag" style="font:600 11px 'Manrope';letter-spacing:.5em;margin-bottom:10px"></div>
    <div id="zone-title" style="font:500 58px/.92 'Cormorant Garamond';text-shadow:0 12px 40px rgba(0,0,0,.35)"></div>
    <div id="zone-lx" style="display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 16px;border-radius:20px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2l2.4 6.6L21 9l-5 4.6L17.4 21 12 17.3 6.6 21 8 13.6 3 9l6.6-.4z"/></svg>
      <span style="font:700 10px 'Manrope';letter-spacing:.12em">LX Hausys 공식 딜러 · AUTHORIZED DEALER</span>
    </div>
  </div>
  <div id="zone-hint" style="position:absolute;right:30px;bottom:30px;z-index:12;font:600 11px 'Manrope';letter-spacing:.2em;display:flex;align-items:center;gap:9px">DRAG TO LOOK · CLICK A SLAB TO ZOOM <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>

  <!-- slab lightbox · zoom -->
  <div id="sel-panel" style="position:absolute;inset:0;z-index:35;display:none;background:rgba(5,7,11,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)">
    <div id="lb-stage" style="flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;height:100%;display:flex">
      <div style="flex:1;position:relative">
        <div id="lb-img" style="position:absolute;left:50%;top:50%;width:min(44vw,600px);height:76%;transform:translate(-50%,-50%);box-shadow:0 70px 150px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.06);will-change:transform"></div>
        <div style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font:600 10px 'Manrope';letter-spacing:.24em;color:rgba(255,255,255,.45);white-space:nowrap">SCROLL / PINCH TO ZOOM · DRAG TO PAN</div>
      </div>
      <div id="sel-side" style="width:392px;max-width:88%;background:linear-gradient(180deg,rgba(14,20,28,.97),rgba(10,14,20,.99));box-shadow:-30px 0 70px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:32px 30px 30px;overflow:auto">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div id="sel-pcode-top" style="color:#e3c789;font:600 10px 'Manrope';letter-spacing:.3em;padding-top:8px"></div>
          <div id="sel-close" style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;color:#fff;font:300 22px 'Manrope'">×</div>
        </div>
        <div id="sel-name" style="font:500 38px/1 'Cormorant Garamond';color:#fff;margin:12px 0 2px"></div>
        <div id="sel-nameko" style="font:500 13px 'Manrope';color:rgba(227,199,137,.85);margin-bottom:14px"></div>
        <div id="sel-blurb" style="font:400 13px/1.7 'Manrope';color:rgba(255,255,255,.6);margin-bottom:16px"></div>
        <div class="specrow"><span>PRODUCT CODE</span><span id="sel-pcode"></span></div>
        <div class="specrow"><span>ORIGIN</span><span id="sel-origin"></span></div>
        <div class="specrow"><span>AVAILABLE SIZE</span><span id="sel-sizes"></span></div>
        <div class="specrow"><span>FINISH</span><span id="sel-finish"></span></div>
        <div class="specrow"><span>CATEGORY</span><span id="sel-code"></span></div>
        <div style="flex:1"></div>
        <div style="display:flex;flex-direction:column;gap:9px;margin-top:24px">
          <button class="cta" style="background:#c9a24b;color:#0b0f15">REQUEST A QUOTE <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <div style="display:flex;gap:9px">
            <button class="cta" style="flex:1;background:transparent;color:#eef3f8;border:1px solid rgba(255,255,255,.3)">1:1 CONSULT</button>
            <button id="sel-cart" class="cta" style="flex:1;background:rgba(227,199,137,.14);color:#e3c789;border:1px solid rgba(227,199,137,.4)">+ MY PROJECT</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- editorial story panel (slides from left) -->
  <div id="story-panel" style="position:absolute;inset:0;z-index:36;display:none;background:rgba(8,11,16,.55);backdrop-filter:blur(5px)">
    <div id="story-card" style="width:472px;max-width:92%;height:100%;background:linear-gradient(180deg,#f7f3ec,#ece2d1);box-shadow:34px 0 80px rgba(0,0,0,.45);overflow:auto;position:relative">
      <div id="story-img" style="height:196px;background-size:cover;background-position:center;position:relative">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,243,236,0) 45%,rgba(247,243,236,1))"></div>
      </div>
      <div style="padding:6px 48px 48px">
        <div id="story-tag" style="font:600 11px 'Manrope';letter-spacing:.34em;color:#a8763f;margin-bottom:14px"></div>
        <div id="story-title" style="font:500 44px/1.04 'Cormorant Garamond';color:#1c222a;margin-bottom:24px"></div>
        <div id="story-paras"></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px;font:600 12px 'Manrope';letter-spacing:.15em;color:#1c222a;border-bottom:1.5px solid #c9a24b;padding-bottom:7px;width:fit-content;cursor:pointer">REQUEST SAMPLES <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
      <div id="story-close" style="position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(20,26,34,.35);display:grid;place-items:center;cursor:pointer;color:#fff;font:300 24px 'Manrope'">×</div>
    </div>
  </div>
</div>

<script src="showroom.js"></script>
</body>
</html>
