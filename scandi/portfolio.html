<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시공 사례 · EUNSEONG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.pf-row{display:flex;gap:48px;align-items:center;padding:36px 0;border-bottom:1px solid rgba(47,59,58,.12);cursor:pointer}
.pf-row.rev{flex-direction:row-reverse}
.pf-photo{flex:1.1;height:340px;border-radius:20px;overflow:hidden;position:relative}
.pf-photo img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.pf-row:hover .pf-photo img{transform:scale(1.05)}
.pf-cap{font:600 9.5px 'Manrope';letter-spacing:.2em;color:#b8935f;margin-bottom:12px}
.pf-title{font-family:'Cormorant Garamond';font-weight:500;font-size:32px;line-height:1.15;color:#2f3b3a;margin-bottom:12px}
.pf-desc{font:400 13.5px/1.75 'Manrope';color:#5c6f69}
.pf-more{display:inline-flex;align-items:center;gap:10px;background:transparent;border:1.5px solid rgba(47,59,58,.2);color:#2f3b3a;padding:14px 30px;border-radius:16px;font:600 12px 'Manrope';cursor:pointer}
.pf-more:hover{background:rgba(47,59,58,.05)}
.specrow3{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(47,59,58,.1)}
.specrow3 span:first-child{font:600 10px 'Manrope';letter-spacing:.16em;color:rgba(47,59,58,.42)}
.specrow3 span:last-child{font:500 13px 'Manrope';color:#2f3b3a;text-align:right}
@media (max-width:800px){ .pf-row,.pf-row.rev{flex-direction:column} .sc-nav{display:none} }
</style>
</head>
<body>

<!-- NAV -->
<div class="sc-topnav">
  <a href="index.html" class="sc-brand">
    <svg width="28" height="28" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#b8935f" stroke-width="1.6"/><circle cx="16" cy="16" r="4.5" fill="#b8935f"/></svg>
    <span style="line-height:1"><span class="sc-brand-name">EUNSEONG</span><span class="sc-brand-sub">CERAMIC · STONE · SURFACE</span></span>
  </a>
  <nav class="sc-nav">

    <a href="process.html">제작과정</a>
    <a href="index.html#inquiry">문의</a>
  </nav>
  <div class="sc-nav-actions">
    <button type="button" class="sc-icon-btn" aria-label="검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <div class="sc-lang">
      <span class="sc-lang-en">EN</span><span class="sc-lang-sep">|</span><span class="sc-lang-ko is-active">KO</span>
    </div>
    <button type="button" class="sc-icon-btn" aria-label="마이페이지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.7-4 4.2-6 7.5-6s5.8 2 7.5 6"/></svg>
    </button>
  </div>
</div>

<!-- ===================== PORTFOLIO ===================== -->
<section style="background:#faf8f3;padding:160px 5vw 130px">
  <div style="max-width:1280px;margin:0 auto">
    <div style="margin-bottom:56px">
      <div class="eyebrow" style="color:#b8935f">PORTFOLIO · 시공 사례</div>
      <div style="font-family:'Cormorant Garamond';font-weight:500;font-size:clamp(32px,4.4vw,54px);line-height:1.08;color:#2f3b3a">완성된 표면들.</div>
    </div>
    <div id="pf-list" style="display:flex;flex-direction:column"></div>
    <div style="display:flex;justify-content:center;margin-top:40px">
      <button id="pf-toggle" class="pf-more"></button>
    </div>
  </div>

  <!-- case lightbox -->
  <div id="case-panel" style="position:fixed;inset:0;z-index:60;display:none;background:rgba(26,34,32,.9);backdrop-filter:blur(8px)">
    <div style="display:flex;height:100%">
      <div id="case-lb-stage" style="flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none">
        <div id="case-lb-img" style="position:absolute;left:50%;top:50%;width:min(70vw,1100px);height:82%;transform:translate(-50%,-50%);background:#1c2422;background-size:contain;background-position:center;background-repeat:no-repeat;box-shadow:0 60px 130px rgba(0,0,0,.7);will-change:transform"></div>
        <div id="case-close-x" style="position:absolute;top:24px;right:24px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;color:#fff;font:300 24px 'Manrope'">×</div>
      </div>
      <div id="case-side" style="width:380px;max-width:88%;background:#faf8f3;padding:36px 32px;overflow:auto">
        <div id="case-cap" style="color:#b8935f;font:600 10px 'Manrope';letter-spacing:.24em;margin-bottom:14px"></div>
        <div id="case-loc" style="font-family:'Cormorant Garamond';font-weight:500;font-size:32px;line-height:1.1;color:#2f3b3a;margin-bottom:14px"></div>
        <div id="case-desc" style="font:400 13.5px/1.75 'Manrope';color:#5c6f69;margin-bottom:18px"></div>
        <div class="specrow3"><span>MATERIAL</span><span id="case-sub"></span></div>
        <div class="specrow3"><span>CATEGORY</span><span id="case-cap2"></span></div>
        <a href="index.html#inquiry" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px;padding:15px;background:#b8935f;color:#fff;border-radius:16px;font:600 12px 'Manrope';text-decoration:none">비슷한 시공 문의하기</a>
      </div>
    </div>
  </div>
</section>

</footer>

</html>
